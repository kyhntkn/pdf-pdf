name: Build exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Derle
        run: >
          pyinstaller --noconfirm --windowed --name PDF-Studio
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all rapidocr_onnxruntime --collect-submodules pdf2docx
          --collect-data pdf2docx --hidden-import fitz
          app/main.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PDF-Studio -DestinationPath PDF-Studio.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio
          path: PDF-Studio.zip
